name: Generate Daily Digest Draft

on:
  schedule:
    # Run at 5 AM PT (13:00 UTC - works for PDT, close enough for PST)
    - cron: '0 13 * * *'
  workflow_dispatch:  # Allow manual triggering for testing

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow pushing commits
      pull-requests: read  # Allow reading PRs if needed
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        # Install dependencies using pip (more reliable in GitHub Actions)
        pip install -r requirements.txt
        pip install -e .
        
        # Verify key dependencies are installed
        python -c "import dotenv; print('dotenv installed')"
        python -c "import httpx; print('httpx installed')"
        python -c "import langchain_core; print('langchain_core installed')"
    
    - name: Generate digest
      env:
        PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || 'ghall1@gmail.com' }}
        PUBLIC_EMAILS: ${{ secrets.PUBLIC_EMAILS || 'ghall1@gmail.com,curvedefi@gmail.com' }}
      run: |
        # Generate signals version
        echo "Generating signals version..."
        ACTIVE_PROMPT=signals python scripts/digest.py --verbose
        if [ $? -ne 0 ]; then
          echo "Signals generation failed with exit code $?"
          exit 1
        fi
        
        # Generate digest version  
        echo "Generating digest version..."
        ACTIVE_PROMPT=digest python scripts/digest.py --verbose
        if [ $? -ne 0 ]; then
          echo "Digest generation failed with exit code $?"
          exit 1
        fi
        
        # Debug: List created files
        echo "Files created in writeup/:"
        ls -la writeup/
        echo "Files created in writeup/thinking_logs/:"
        ls -la writeup/thinking_logs/ || echo "No thinking_logs directory"
    
    - name: Commit and push digest
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Check if there are any changes to commit
        if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
          echo "No changes to commit"
        else
          git add writeup/
          git commit -m "🤖 Auto-generated daily digest draft - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
        fi
    
    - name: Send admin notification
      env:
        GHOST_URL: ${{ secrets.GHOST_URL }}
        GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || 'ghall1@gmail.com' }}
      run: |
        # Create Ghost drafts with actual digest content for both versions
        echo "Creating Ghost drafts for admin review..."
        
        # Use today's date to find the specific files we just generated
        TODAY=$(date -u '+%Y-%m-%d')
        SIGNALS_FILE="writeup/signals_${TODAY}.md"
        DIGEST_FILE="writeup/digest_${TODAY}.md"
        
        echo "Looking for today's files:"
        echo "Signals file: $SIGNALS_FILE"
        echo "Digest file: $DIGEST_FILE"
        
        # Check if today's files exist
        if [ ! -f "$SIGNALS_FILE" ] || [ ! -f "$DIGEST_FILE" ]; then
          echo "Error: Could not find today's files"
          echo "Available files:"
          ls -la writeup/*.md
          exit 1
        fi
        
        # Create Ghost drafts with actual content
        python -c "
        import sys
        sys.path.insert(0, 'src')
        from squid_digest.email import GhostEmailClient
        from pathlib import Path
        
        client = GhostEmailClient()
        
        # Create signals draft
        signals_path = Path('$SIGNALS_FILE')
        if signals_path.exists():
            content = signals_path.read_text()
            html_content = client.format_digest_html(content)
            title = f'📊 Trading Signals Draft - {signals_path.stem.split(\"_\")[-1]}'
            post = client.create_post(title, html_content, status='draft')
            print(f'✓ Created signals draft: {post.get(\"id\", \"unknown\")}')
        
        # Create digest draft  
        digest_path = Path('$DIGEST_FILE')
        if digest_path.exists():
            content = digest_path.read_text()
            html_content = client.format_digest_html(content)
            title = f'📰 Daily Digest Draft - {digest_path.stem.split(\"_\")[-1]}'
            post = client.create_post(title, html_content, status='draft')
            print(f'✓ Created digest draft: {post.get(\"id\", \"unknown\")}')
        
        print('✓ Both drafts created successfully for admin review')
        "
