[project]
name = "squid-digest"
version = "0.1.0"
description = "AI-powered daily news digest generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.4.2",
]

[project.scripts]
digest-news = "digest.cli:main"

[tool.uv.sources]
digest = { path = "./src/digest" }

[tool.uv]
package = true
